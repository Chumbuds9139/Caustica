pluginManagement {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = "caustica"

gradle.rootProject {
	repositories {
		maven {
			name = "CaffeineMC"
			url = uri("https://maven.caffeinemc.net/releases")
		}
	}
	afterEvaluate {
		if (pluginManager.hasPlugin("fabric-loom")) {
			dependencies.add("modCompileOnly", "net.caffeinemc:sodium-fabric-api:0.9.1+mc26.2")
		}
	}
}
