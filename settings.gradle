pluginManagement {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = "caustica"

// Optional Sodium Config API (compile-only). Sodium is not required at runtime.
gradle.projectsLoaded {
	rootProject.repositories.maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
	rootProject.dependencies.add("compileOnly", "net.caffeinemc:sodium-fabric-api:0.9.1+mc26.2")
}
