pluginManagement {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = "caustica"

// Sodium's config API is compile-only. Use Gradle's standard compileOnly
// configuration — Loom's modCompileOnly is not guaranteed to exist when
// settings.gradle afterEvaluate runs.
gradle.rootProject {
	repositories {
		maven {
			name = "CaffeineMC"
			url = uri("https://maven.caffeinemc.net/releases")
		}
	}
	afterEvaluate {
		dependencies.add("compileOnly", "net.caffeinemc:sodium-fabric-api:0.9.1+mc26.2")
	}
}
